# TacVar build-time measurement configuration for lmbench
# Change a value, then rebuild. Runtime does not re-select backends.
#
# TACVAR_TIMER options:
#   native              # alias for gettimeofday (lmbench original)
#   gettimeofday        # original lmbench timer
#   clock_gettime       # CLOCK_MONOTONIC
#   papi_get_real_nsec  # requires PAPI
#   rdtsc               # x86 only
#   rdtscp              # x86 only
#   rdtscp_lfence       # x86 only
#   tsc_asym            # x86 Paoloni
#   cntvct_el0          # aarch64 only; requires TACVAR_NSTP
#   cntvct_el0_dmb      # aarch64 only
# (mpi_wtime / omp_get_wtime are not valid for lmbench)
TACVAR_TIMER=native

TACVAR_NSTP=0

# TACVAR_COUNTER_BACKEND options:
#   none | perf_event_open | papi_read | asm
TACVAR_COUNTER_BACKEND=none
TACVAR_COUNTER_COUNT=0
TACVAR_COUNTER_NAMES=

TACVAR_OUTPUT_ROOT=.
