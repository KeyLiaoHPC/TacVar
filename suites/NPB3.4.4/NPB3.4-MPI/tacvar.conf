# TacVar build-time measurement configuration for NPB-MPI
# Change a value, then: make tacvar_clean && make <bench> CLASS=...
# Runtime does not re-select backends.
#
# TACVAR_TIMER options:
#   native              # alias for mpi_wtime (NPB-MPI original)
#   mpi_wtime           # original NPB-MPI timer (MPI_Wtime)
#   clock_gettime       # CLOCK_MONOTONIC
#   papi_get_real_nsec  # requires PAPI
#   rdtsc               # x86 only, non-serializing
#   rdtscp              # x86 only
#   rdtscp_lfence       # x86 only
#   tsc_asym            # x86 Paoloni CPUID+RDTSC / RDTSCP+CPUID
#   cntvct_el0          # aarch64 only; requires TACVAR_NSTP
#   cntvct_el0_dmb      # aarch64 only; DMB ISH around CNTVCT
# (gettimeofday / omp_get_wtime are not valid for NPB-MPI)
TACVAR_TIMER=papi_get_real_nsec

# Nanoseconds per CNTVCT tick (ARM only). Ignored on x86 / non-cntvct timers.
# Example: 10 means 100 MHz virtual counter.
TACVAR_NSTP=0

# TACVAR_COUNTER_BACKEND options:
#   none
#   perf_event_open
#   papi_read
#   asm                 # x86 RDPMC via ph_enable_pmu, or ARM MRS PMU
TACVAR_COUNTER_BACKEND=papi_read

# Must equal the number of comma-separated TACVAR_COUNTER_NAMES.
TACVAR_COUNTER_COUNT=4

# Examples:
#   cpu-cycles,instructions
#   CPU_CYCLES,INST_RETIRED
#   INST_RETIRED.ANY_P,CPU_CLK_UNHALTED.THREAD
#   0x43003c  (raw PERFEVTSEL / PMU code)
TACVAR_COUNTER_NAMES=CPU_CYCLES,INST_RETIRED,PAPI_STL_ICY,PAPI_LST_INS

# CSV root directory (relative to benchmark cwd). Files go under data_YYYYMMDDTHHmmss/.
TACVAR_OUTPUT_ROOT=.

# In-situ timing-fluctuation sampling (NPB-MPI timer adapter only).
# OFF: normal kernel-interval timing → bin/<bench>.<CLASS>.x
# ON:  rebuild after a normal run + get_median.py; emits
#      bin/<bench>.<CLASS>_tf.x
# TACVAR_TF_DATA_ROOT must point at the existing data_YYYYMMDDTHHmmss directory
# (contains median.csv with ngauge, and nspg.txt). Relative paths are resolved
# against this file. See in-situ-sampling.md.
TACVAR_TF_SAMPLING_MODE=OFF
TACVAR_TF_DATA_ROOT=
# Optional override of nspg (ns per subtraction). 0 → read DATA_ROOT/nspg.txt.
TACVAR_TF_NSPG=0
