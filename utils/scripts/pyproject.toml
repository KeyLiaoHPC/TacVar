[project]
name = "npb-timer-campaign"
version = "0.1.0"
description = "NPB-MPI timer/counter campaign generation, analysis, and academic plotting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["npb_timer_campaign"]

[tool.uv]
package = true
